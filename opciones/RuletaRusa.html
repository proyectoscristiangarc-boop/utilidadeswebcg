<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Rusa de Datos Interactiva</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
            position: relative;
        }

        .btn-regresar {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background-color: #334155;
            color: var(--text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            z-index: 100;
        }

        .btn-regresar:hover {
            background-color: #475569;
        }

        .btn-regresar:active {
            transform: scale(0.98);
        }

        h1 {
            margin-top: 2rem;
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
            text-align: center;
            background: linear-gradient(to right, #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }
            .container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .btn-regresar {
                position: static;
                margin-bottom: 0.5rem;
                align-self: flex-start;
            }
            h1 {
                margin-top: 0.5rem;
                font-size: 1.8rem;
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        h2 {
            font-size: 1.25rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 130px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.75rem;
            resize: vertical;
            font-size: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: var(--accent);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .ruleta-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 6px solid #334155;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #334155;
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .result-box {
            margin-top: 1rem;
            font-size: 1.25rem;
            font-weight: bold;
            min-height: 2rem;
            text-align: center;
            color: #38bdf8;
        }

        .items-list {
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .items-list li {
            background-color: #0f172a;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .items-list li button {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            padding: 0 0.5rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="../index.html" class="btn-regresar">
        ← Menú Principal
    </a>

    <h1>Ruleta Rusa de Datos</h1>

    <div class="container">
     
        <div class="card">
            <h2>1. Configura tus datos</h2>
            <p style="font-size: 0.85rem; color: #94a3b8;">Ingresa los elementos separados por comas (,) o uno por línea.</p>
            <textarea id="inputDatos" placeholder="Ejemplo: Opción 1, Opción 2, Opción 3&#10;Opción 4"></textarea>
            
            <div class="checkbox-container">
                <input type="checkbox" id="eliminarGanador" checked>
                <label for="eliminarGanador">Eliminar el dato automáticamente al salir</label>
            </div>

            <button class="btn" onclick="cargarDatos()">Actualizar Ruleta</button>

            <h2>Elementos Restantes (<span id="contadorItems">0</span>)</h2>
            <ul id="listaElementos" class="items-list">
                
            </ul>
        </div>

        <div class="card ruleta-section">
            <h2>2. ¡Gira la Ruleta!</h2>
            
            <div class="wheel-container" id="wheelContainer">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>

            <div class="result-box" id="resultado">Resultado: --</div>

            <button class="btn btn-danger" id="btnGirar" onclick="girarRuleta()">¡Girar!</button>
        </div>
    </div>

    <script>
        let elementos = [];
        let anguloActual = 0;
        let girando = false;

        const colores = [
            '#6366f1', '#ec4899', '#8b5cf6', '#3b82f6', 
            '#10b981', '#f59e0b', '#ef4444', '#14b8a6', '#64748b'
        ];

        window.onload = () => {
            cargarDatos();
        };

        function cargarDatos() {
            const texto = document.getElementById('inputDatos').value;
            elementos = texto.split(/[\n,]+/).map(item => item.trim()).filter(item => item.length > 0);
            actualizarInterfaz();
            dibujarRuleta();
        }

        function actualizarInterfaz() {
            const lista = document.getElementById('listaElementos');
            const contador = document.getElementById('contadorItems');
            
            contador.textContent = elementos.length;
            lista.innerHTML = '';

            if (elementos.length === 0) {
                document.getElementById('btnGirar').disabled = true;
                document.getElementById('btnGirar').style.opacity = 0.5;
                return;
            }

            document.getElementById('btnGirar').disabled = false;
            document.getElementById('btnGirar').style.opacity = 1;

            elementos.forEach((el, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${el}</span> <button onclick="eliminarElemento(${index})">✕</button>`;
                lista.appendChild(li);
            });
        }

        function dibujarRuleta() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const total = elementos.length;
            const centro = canvas.width / 2;
            const radio = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (total === 0) {
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.arc(centro, centro, radio, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Vacía', centro, centro);
                return;
            }

            const arc = (2 * Math.PI) / total;

            elementos.forEach((item, i) => {
                const anguloInicio = i * arc;
                const anguloFin = anguloInicio + arc;

                ctx.beginPath();
                ctx.fillStyle = colores[i % colores.length];
                ctx.moveTo(centro, centro);
                ctx.arc(centro, centro, radio, anguloInicio, anguloFin);
                ctx.lineTo(centro, centro);
                ctx.fill();

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centro, centro);
                ctx.rotate(anguloInicio + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                
                let textoMostrar = item;
                if (textoMostrar.length > 12) {
                    textoMostrar = textoMostrar.substring(0, 10) + '..';
                }

                ctx.fillText(textoMostrar, radio - 20, 6);
                ctx.restore();
            });
        }

        function eliminarElemento(index) {
            if (girando) return;
            elementos.splice(index, 1);
            document.getElementById('inputDatos').value = elementos.join(', ');
            actualizarInterfaz();
            dibujarRuleta();
        }

        function girarRuleta() {
            if (girando || elementos.length === 0) return;
            girando = true;
            document.getElementById('resultado').textContent = "Girando...";

            const indiceGanador = Math.floor(Math.random() * elementos.length);
            const totalItems = elementos.length;
            const gradosPorItem = 360 / totalItems;

            const vueltasFijas = 8;
            
            const anguloDestino = anguloActual + (vueltasFijas * 360) + (360 - ((anguloActual + (indiceGanador * gradosPorItem) + (gradosPorItem / 2)) % 360));

            anguloActual = anguloDestino;
            
            const wheelContainer = document.getElementById('wheelContainer');
            wheelContainer.style.transform = `rotate(${anguloActual}deg)`;
            
            setTimeout(() => {
                girando = false;
                const ganador = elementos[indiceGanador];
                document.getElementById('resultado').textContent = `🎉 Salió: ${ganador}`;

                const eliminarAuto = document.getElementById('eliminarGanador').checked;
                if (eliminarAuto) {
                    elementos.splice(indiceGanador, 1);
                    document.getElementById('inputDatos').value = elementos.join(', ');
                    actualizarInterfaz();
                    dibujarRuleta();
                }
            }, 5000);
        }
    </script>
</body>
</html>
