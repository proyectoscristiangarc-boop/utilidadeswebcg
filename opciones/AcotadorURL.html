
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acortador de URL</title>
    <style>
        
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-color: white;
            --text-light: #afb6c0;
            --border-color: #cbd5e1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-image: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }

        
        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .home {
            width: 100%;
            height: 5vh;
            display: flex;
            justify-content: left;
            align-items: center;
        }

        .home button{
            width: auto;
            height: 100%;
            padding: 1%;
            font-weight: 600;
            color: white;
            cursor: pointer;
            border: 1px solid transparent;
            background-color: rgba(6, 22, 46, 0.7);
        }

        .header h1 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
        }

        input[type="url"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-group button {
            padding: 14px 24px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .input-group button:hover {
            background-color: var(--primary-hover);
        }

        .input-group button:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .result-container.active {
            display: flex;
        }

        .result-label {
            font-size: 0.85rem;
            color: black;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-box {
            display: flex;
            gap: 10px;
        }

        .result-input {
            flex: 1;
            padding: 10px 14px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            color: rgb(13, 13, 68);
            font-weight: 500;
            outline: none;
        }

        .btn-copy {
            padding: 10px 18px;
            background-color: var(--primary-color);
            font-size: 0.9rem;
        }

        .btn-copy:hover {
            background-color: #334155;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="home">
            <button onclick="window.location.href='../index.html'">Regresar</button>
            </div>
            <h1>Acortador de URL</h1>
            <p>Transforma tus enlaces largos en URLs cortas y fáciles de compartir.</p>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="url" id="longUrl" placeholder="Pega tu enlace aquí (ej. https://miwebsite.com/largo)..." required>
            </div>
            <button id="shortenBtn" onclick="generarUrlCorto()">Acortar Enlace</button>
        </div>

        <!-- Contenedor del resultado simulado -->
        <div class="result-container" id="resultContainer">
            <span class="result-label">Tu enlace acortado:</span>
            <div class="result-box">
                <input type="text" class="result-input" id="shortUrl" readonly value="https://sho.rt/xyz123">
                <button class="btn-copy" onclick="copiarAlPortapapeles()">Copiar</button>
            </div>
        </div>
    </div>

    <script>
        function generarUrlCorto() {
            const urlInput = document.getElementById('longUrl').value;
            const resultContainer = document.getElementById('resultContainer');
            const shortUrlInput = document.getElementById('shortUrl');

            if (!urlInput) {
                alert('Por favor, ingresa una URL válida.');
                return;
            }

            // Simulación de generación de URL corta (en un entorno real, aquí conectarías una API como TinyURL o Bitly)
            const randomCode = Math.random().toString(36).substring(2, 8);
            shortUrlInput.value = `https://sho.rt/${randomCode}`;

            // Mostrar el contenedor de resultados
            resultContainer.classList.add('active');
        }

        function copiarAlPortapapeles() {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            shortUrlInput.setSelectionRange(0, 99999); // Para dispositivos móviles
            
            navigator.clipboard.writeText(shortUrlInput.value).then(() => {
                const copyBtn = document.querySelector('.btn-copy');
                copyBtn.textContent = '¡Copiado!';
                setTimeout(() => {
                    copyBtn.textContent = 'Copiar';
                }, 2000);
            });
        }
    </script>
</body>
</html>
