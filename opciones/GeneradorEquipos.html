<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Equipos Aleatorios</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
            --error: #ef4444;
            --border: #334155;
            --secondary-btn: #475569;
            --secondary-btn-hover: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
            position: relative;
        }

        .btn-regresar {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background-color: var(--border);
            color: var(--text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            z-index: 100;
        }

        .btn-regresar:hover {
            background-color: #475569;
        }

        .btn-regresar:active {
            transform: scale(0.98);
        }

        .header-container {
            text-align: center;
            max-width: 700px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            color: #d1d5db;
            margin-bottom: 0.5rem;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }
            .main-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .btn-regresar {
                position: static;
                margin-bottom: 0.5rem;
                align-self: flex-start;
            }
            .header-container {
                margin-top: 0.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.75rem;
            resize: vertical;
            font-size: 1rem;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 0.75rem;
            font-size: 1rem;
        }

        .btn-container {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: #6366f1;
        }
        .btn-success:hover {
            background-color: #4f46e5;
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }
        .btn-secondary:hover {
            background-color: var(--secondary-btn-hover);
        }

        /* Etiqueta de Mensajes y Alertas */
        .alert-label {
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 1.2rem;
            transition: color 0.2s;
        }

        .alert-error {
            color: var(--error);
        }

        .alert-success {
            color: var(--accent);
        }

        
        .results-scroll {
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.5rem;
        }

        .team-box {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .team-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-members {
            list-style-type: disc;
            padding-left: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .team-members li {
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .placeholder-result {
            text-align: center;
            color: #64748b;
            margin-top: 5rem;
            font-style: italic;
        }
    </style>
</head>
<body>
  
    <a href="../index.html" class="btn-regresar">
        ← Menú Principal
    </a>

    <div class="header-container">
        <h1>Generador de Equipos Aleatorios</h1>
    </div>

    <div class="main-container">
        
        <div class="card">
            <h2>1. Configurar Participantes</h2>
            
            <div class="config-group">
                <label for="inputParticipantes">Nombres (separados por comas o saltos de línea):</label>
                <textarea id="inputParticipantes" placeholder="Ej: Carlos, Ana, Luis, Sofía, Miguel..."></textarea>
            </div>

            <div class="config-group">
                <label for="numEquipos">Número de equipos a generar:</label>
                <input type="number" id="numEquipos" min="1" value="2">
            </div>

    
            <div id="alertLabel" class="alert-label"></div>

            <div class="btn-container">
                <button class="btn btn-success" onclick="generarEquipos()">✨ Sortear</button>
                <button class="btn btn-secondary" onclick="limpiarTodo()">🧹 Limpiar</button>
            </div>
        </div>

        <div class="card">
            <h2>2. Equipos Generados</h2>
            <div id="resultadosContainer" class="results-scroll">
                <p class="placeholder-result">Configura tus datos y haz clic en "Sortear" para ver los equipos aquí.</p>
            </div>
        </div>
    </div>

    <script>
        function mostrarAlerta(mensaje, esError = true) {
            const label = document.getElementById('alertLabel');
            label.textContent = mensaje;
            label.className = `alert-label ${esError ? 'alert-error' : 'alert-success'}`;
        }

        function limpiarTodo() {
            document.getElementById('inputParticipantes').value = '';
            document.getElementById('numEquipos').value = '2';
            document.getElementById('alertLabel').textContent = '';
            document.getElementById('resultadosContainer').innerHTML = `
                <p class="placeholder-result">Configura tus datos y haz clic en "Sortear" para ver los equipos aquí.</p>
            `;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generarEquipos() {
            const texto = document.getElementById('inputParticipantes').value;
            const participantes = texto.split(/[\n,]+/).map(p => p.trim()).filter(p => p.length > 0);
            const numEquipos = parseInt(document.getElementById('numEquipos').value);

            if (participantes.length === 0) {
                mostrarAlerta("Por favor ingresa al menos un participante.", true);
                return;
            }

            if (isNaN(numEquipos) || numEquipos <= 0) {
                mostrarAlerta("Por favor ingresa un número de equipos válido mayor a 0.", true);
                return;
            }

            if (numEquipos > participantes.length) {
                mostrarAlerta("El número de equipos no puede ser mayor que el total de participantes.", true);
                return;
            }

            
            mostrarAlerta("¡Equipos generados exitosamente!", false);

            
            const participantesMezclados = shuffleArray([...participantes]);

            
            const equipos = Array.from({ length: numEquipos }, () => []);

           
            participantesMezclados.forEach((participante, index) => {
                const indiceEquipo = index % numEquipos;
                equipos[indiceEquipo].push(participante);
            });

            
            renderizarEquipos(equipos);
        }

        function renderizarEquipos(equipos) {
            const contenedor = document.getElementById('resultadosContainer');
            contenedor.innerHTML = '';

            equipos.forEach((equipo, index) => {
                const teamBox = document.createElement('div');
                teamBox.className = 'team-box';

                const teamTitle = document.createElement('div');
                teamTitle.className = 'team-title';
                teamTitle.innerHTML = `<span>Equipo ${index + 1}</span> <span style="font-size:0.8rem; color:#94a3b8;">(${equipo.length} integrantes)</span>`;

                const membersList = document.createElement('ul');
                membersList.className = 'team-members';

                if (equipo.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = 'Vacío';
                    membersList.appendChild(li);
                } else {
                    equipo.forEach(miembro => {
                        const li = document.createElement('li');
                        li.textContent = miembro;
                        membersList.appendChild(li);
                    });
                }

                teamBox.appendChild(teamTitle);
                teamBox.appendChild(membersList);
                contenedor.appendChild(teamBox);
            });
        }
    </script>
</body>
</html>
