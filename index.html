
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades Web CG</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --secondary-color: #64748b;
            --secondary-hover: #475569;
            --accent-bg: #f0f9ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--secondary-color);
            font-size: 0.95rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.4;
        }

        .category-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-menu label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary-dark);
        }

        .category-select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            background-color: #fff;
            color: var(--text-color);
            outline: none;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .category-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .tool-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .tool-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .tool-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .tool-desc {
            font-size: 0.88rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .tool-link {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            display: block;
        }

        .tool-link:hover {
            background-color: var(--primary-dark);
        }

        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            color: var(--secondary-color);
            font-size: 0.85rem;
            margin-top: auto;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.6rem;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Utilidades Web CG</h1>
            <p>Plataforma integral de herramientas de diferentes áreas.</p>
        </header>

        <div class="category-menu">
            <label for="filtroCategoria">Filtrar por categoría:</label>
            <select id="filtroCategoria" class="category-select" onchange="filtrarCategoria(this.value)">
            </select>
        </div>

        <div class="tools-grid" id="gridHerramientas">
            
        </div>
    </div>

    <footer>
        Derechos Reservados Copyright © Cristian Garcia
    </footer>

    <script src="js/datos.js"></script>

    <script>
        function cargarCategorias() {
            const select = document.getElementById('filtroCategoria');
            select.innerHTML = '';
            
            categoriasData.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.value;
                option.textContent = cat.label;
                select.appendChild(option);
            });
        }

        function cargarHerramientas(filtro = 'all') {
            const grid = document.getElementById('gridHerramientas');
            grid.innerHTML = '';

            const herramientasFiltradas = filtro === 'all' 
                ? herramientasData 
                : herramientasData.filter(item => item.categoria === filtro);

            herramientasFiltradas.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.setAttribute('data-category', tool.categoria);

                card.innerHTML = `
                    <div>
                        <div class="tool-category">${tool.nombreCategoria}</div>
                        <div class="tool-title">${tool.titulo}</div>
                        <div class="tool-desc">${tool.descripcion}</div>
                    </div>
                    <a href="${tool.link}" class="tool-link">Abrir Herramienta</a>
                `;

                grid.appendChild(card);
            });
        }

        function filtrarCategoria(categoria) {
            cargarHerramientas(categoria);
        }

        window.onload = function() {
            cargarCategorias();
            cargarHerramientas('all');
        };
    </script>

</body>
</html>
