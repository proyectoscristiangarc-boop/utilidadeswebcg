<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Depreciación de Activos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-hover: #b91c1c;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #cbd5e1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-navbar {
            background: var(--primary-color);
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-menu {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        .navbar-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .controls-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .controls-card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-color);
        }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .table-container {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .table-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .table-header-flex h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
            min-width: 600px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        @media (max-width: 600px) {
            .top-navbar {
                padding: 12px 15px;
            }

            .main-content {
                padding: 20px 10px;
            }

            .table-header-flex {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-action {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <button id="btnMenuPrincipal" class="btn-menu" onclick="regresarMenu()">
            <span>←</span> Menú Principal
        </button>
        <span class="navbar-title">CG</span>
    </header>

    <main class="main-content">
        <header>
            <h1>Simulador de Depreciación de Activos</h1>
        </header>

        <section class="controls-card">
            <h2>Datos del Activo</h2>
            <form id="depreciationForm" class="form-grid">
                <div class="input-group">
                    <label for="activo">Nombre del Activo:</label>
                    <input type="text" id="activo" placeholder="Ej. Maquinaria pesada" required>
                </div>
                <div class="input-group">
                    <label for="costo">Costo Inicial ($):</label>
                    <input type="number" id="costo" placeholder="Ej. 10000.00" min="0.01" step="0.01" required>
                </div>
                <div class="input-group">
                    <label for="salvamento">Valor de Salvamento ($):</label>
                    <input type="number" id="salvamento" placeholder="Ej. 1000.00" min="0" step="0.01" required>
                </div>
                <div class="input-group">
                    <label for="vida">Vida Útil (Años):</label>
                    <input type="number" id="vida" placeholder="Ej. 5" min="1" step="1" required>
                </div>
                <div class="input-group">
                    <label for="metodo">Método de Depreciación:</label>
                    <select id="metodo">
                        <option value="lineal">Línea Recta (Lineal)</option>
                        <option value="acelerado">Suma de Dígitos (Acelerado)</option>
                    </select>
                </div>
            </form>
            <div>
                <button type="button" class="btn-action" onclick="calcularDepreciacion()">Calcular Depreciación</button>
            </div>
        </section>

        <section class="table-container">
            <div class="table-header-flex">
                <h2>Tabla de Depreciación</h2>
                <button class="btn-action" onclick="generarPDF()">
                    📥 Descargar Reporte PDF
                </button>
            </div>

            <div class="table-responsive">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th>Año</th>
                            <th>Activo</th>
                            <th>Depreciación Anual</th>
                            <th>Depreciación Acumulada</th>
                            <th>Valor en Libros</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align: center; color: var(--text-light);">No hay simulaciones registradas.Completa los datos superiores.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        let registrosDepreciacion = [];

        function calcularDepreciacion() {
            const activo = document.getElementById('activo').value.trim();
            const costo = parseFloat(document.getElementById('costo').value);
            const salvamento = parseFloat(document.getElementById('salvamento').value);
            const vida = parseInt(document.getElementById('vida').value);
            const metodo = document.getElementById('metodo').value;

            if (!activo || isNaN(costo) || isNaN(salvamento) || isNaN(vida) || vida <= 0) {
                alert('Por favor completa todos los campos correctamente.');
                return;
            }

            if (salvamento >= costo) {
                alert('El valor de salvamento no puede ser mayor o igual al costo inicial.');
                return;
            }

            registrosDepreciacion = []; 
            let depreciacionAcumulada = 0;
            let valorEnLibros = costo;
            const depreciable = costo - salvamento;

            if (metodo === 'lineal') {
                const depAnual = depreciable / vida;
                for (let i = 1; i <= vida; i++) {
                    depreciacionAcumulada += depAnual;
                    valorEnLibros -= depAnual;
                    registrosDepreciacion.push({
                        anio: i,
                        activo: activo,
                        anual: depAnual,
                        acumulada: depreciacionAcumulada,
                        libros: Math.max(valorEnLibros, salvamento)
                    });
                }
            } else {
                
                const sumaDigitos = (vida * (vida + 1)) / 2;
                for (let i = 1; i <= vida; i++) {
                    const factor = (vida - i + 1) / sumaDigitos;
                    const depAnual = depreciable * factor;
                    depreciacionAcumulada += depAnual;
                    valorEnLibros -= depAnual;
                    registrosDepreciacion.push({
                        anio: i,
                        activo: activo,
                        anual: depAnual,
                        acumulada: depreciacionAcumulada,
                        libros: Math.max(valorEnLibros, salvamento)
                    });
                }
            }

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (registrosDepreciacion.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-light);">No hay simulaciones registradas. Completa los datos superiores.</td></tr>`;
                return;
            }

            registrosDepreciacion.forEach((reg, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>Año ${reg.anio}</td>
                    <td>${reg.activo}</td>
                    <td>$${reg.anual.toFixed(2)}</td>
                    <td>$${reg.acumulada.toFixed(2)}</td>
                    <td>$${reg.libros.toFixed(2)}</td>
                    <td><button class="btn-delete" onclick="eliminarRegistro(${index})">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function eliminarRegistro(index) {
            registrosDepreciacion.splice(index, 1);
            renderTable();
        }

        function generarPDF() {
            if (registrosDepreciacion.length === 0) {
                alert("No hay registros para exportar.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.setTextColor(15, 23, 42);
            doc.text("Reporte de Depreciación de Activos", 14, 20);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(100, 116, 139);
            doc.text(`Fecha de emisión: ${new Date().toLocaleDateString()}`, 14, 28);

            const tableData = registrosDepreciacion.map(r => [
                `Año ${r.anio}`,
                r.activo,
                `$${r.anual.toFixed(2)}`,
                `$${r.acumulada.toFixed(2)}`,
                `$${r.libros.toFixed(2)}`
            ]);

            doc.autoTable({
                startY: 38,
                head: [['Año', 'Activo', 'Dep. Anual', 'Dep. Acumulada', 'Valor en Libros']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [15, 23, 42] }
            });

            doc.save("reporte_depreciacion.pdf");
        }

        function regresarMenu() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
